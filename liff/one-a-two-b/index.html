<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>每日 1A2B</title>
    <link rel="stylesheet" href="oneATwoB.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-top">
        <h1>🔐 每日 1A2B</h1>
        <button id="help-button" class="help-button" aria-label="遊戲說明">❓</button>
      </div>
      <p id="subtitle" class="subtitle">載入中…</p>
    </header>

    <main>
      <div id="message" class="message" hidden></div>

      <div id="grid" class="grid" hidden></div>

      <div id="keyboard" class="keyboard" hidden></div>

      <div id="finish" class="finish" hidden>
        <p id="finish-text"></p>
        <button id="share-button" class="share-button">📤 分享到群組</button>
      </div>
    </main>

    <div id="tutorial" class="modal-overlay" hidden>
      <div class="modal">
        <h2>怎麼玩？</h2>
        <p>主持人想了一組 4 位不重複的數字密碼，在 10 次機會內用邏輯推理猜出來。</p>

        <p class="modal-label">每次猜測後，方塊顏色會告訴你猜得準不準：</p>
        <div class="example-row">
          <div class="tile correct">1</div>
          <div class="tile">2</div>
          <div class="tile present">5</div>
          <div class="tile">2</div>
        </div>
        <ul class="legend">
          <li><span class="dot correct"></span>綠色（A）：數字對，位置也對</li>
          <li><span class="dot present"></span>黃色（B）：數字有出現在密碼裡，位置不對</li>
          <li><span class="dot absent"></span>灰色：密碼裡沒有這個數字</li>
        </ul>

        <p>用下方數字鍵盤輸入，湊滿 4 位不重複數字後點「確認」送出。猜對或用完 10 次機會後遊戲結束，可以分享成績到群組，或在群組輸入「1a2b 排行」看看大家的排名（依猜測次數、再依花費時間排序）。</p>

        <button id="tutorial-close" class="tutorial-close">開始挑戰！</button>
      </div>
    </div>

    <!-- LIFF SDK：CDN 版本，沒有前端建構工具，直接引用官方腳本即可 -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="oneATwoB.js"></script>
  </body>
</html>
